name: Policy watch

# Weekly: fetch the Apple and Google publishing policies, compare each clause
# hash with skills/store-review-audit/references/policy-catalog.json and open an issue when anything
# changed. With no change, only the catalogue's "checked" date moves forward, so the
# policy digest stays usable; changed clauses are updated by a reviewed commit, never here.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      rewrite:
        description: "Rewrite the catalogue and open a pull request (after adding sources)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rewrite the catalogue and open a pull request
        if: inputs.rewrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 skills/store-review-audit/scripts/fetch_policies.py --write
          branch="policy-catalogue-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: rewrite policy catalogue from current sources" || { echo "catalogue unchanged"; exit 0; }
          git push origin "$branch"
          # Actions may not open pull requests in this repository; an issue points at the branch instead.
          gh issue create --title "Policy catalogue rewritten on $branch" --body "Review and merge https://github.com/${{ github.repository }}/compare/main...$branch . Update policy-digest.json for any changed Google policy page first."
      - name: Compare policies with the catalogue
        if: ${{ !inputs.rewrite }}
        id: check
        run: |
          set +e
          python3 skills/store-review-audit/scripts/fetch_policies.py --check > changes.txt
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat changes.txt
          # 0: no change, 1: changes found, 2: a source could not be fetched
          if [ "$code" -eq 2 ]; then exit 1; fi
          exit 0
      - name: Record the check date when nothing changed
        if: steps.check.outputs.code == '0'
        run: |
          python3 - <<'PY'
          import json, datetime, pathlib
          p = pathlib.Path("skills/store-review-audit/references/policy-catalog.json")
          data = json.loads(p.read_text())
          data["checked"] = datetime.date.today().isoformat()
          p.write_text(json.dumps(data, indent=1, ensure_ascii=True) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: policy catalogue checked $(date -u +%F), no changes" || exit 0
          git push
      - name: Open or update the policy change issue
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Policy changes detected"
          {
            echo "The weekly policy watch found changed, added or removed clauses."
            echo
            echo '```'
            cat changes.txt
            echo '```'
            echo
            echo "Review each item against skills/store-review-audit/references/checklist.md, rules.json and special-cases.md, and rewrite its entry in policy-digest.json."
            echo "When done, run \`python3 skills/store-review-audit/scripts/fetch_policies.py --write\` and commit the catalogue with the skill changes."
          } > body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
      - name: Verify the deadline sources
        if: ${{ !inputs.rewrite }}
        id: deadlines
        run: |
          set +e
          python3 skills/store-review-audit/scripts/check_deadlines.py --verify > deadlines.txt
          # 0: every quote still on its source, 1: a quote is gone, 2: a source could not be fetched
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat deadlines.txt
          if [ "$code" -eq 2 ]; then exit 1; fi
          exit 0
      - name: Record the deadline verification date
        if: steps.deadlines.outputs.code == '0'
        run: |
          python3 - <<'PY'
          import json, datetime, pathlib
          p = pathlib.Path("skills/store-review-audit/references/deadlines.json")
          data = json.loads(p.read_text())
          data["verified"] = datetime.date.today().isoformat()
          p.write_text(json.dumps(data, indent=1, ensure_ascii=True) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deadline sources verified $(date -u +%F), no changes" || exit 0
          # the catalogue step above may have pushed a commit in this run
          git pull --rebase
          git push
      - name: Open or update the deadline issue
        if: steps.deadlines.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Deadline sources changed"
          {
            echo "The weekly watch no longer finds these deadline quotes on their official source."
            echo
            echo '```'
            grep '^changed' deadlines.txt
            echo '```'
            echo
            echo "Open each source, then correct or remove the entry in skills/store-review-audit/references/deadlines.json and set its verified_on date."
          } > body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
